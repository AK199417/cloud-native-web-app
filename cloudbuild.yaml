steps:
  # Step 1: Login to Docker Hub using Cloud Build substitution variable
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "${_DOCKERHUB_TOKEN}" | docker login --username=arulrajah --password-stdin

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'docker.io/arulrajah/cloud-native-web-app:$SHORT_SHA'
      - '-t'
      - 'docker.io/arulrajah/cloud-native-web-app:latest'
      - '.'

  # Step 3: Push image with commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'docker.io/arulrajah/cloud-native-web-app:$SHORT_SHA'

  # Step 4: Push latest image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'docker.io/arulrajah/cloud-native-web-app:latest'

  # Step 5: Deploy updated image to GKE
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'apply'
      - '--filename=deployment.yaml'
      - '--image=docker.io/arulrajah/cloud-native-web-app:latest'
      - '--location=australia-southeast1'
      - '--cluster=cluster-1'

images:
  - 'docker.io/arulrajah/cloud-native-web-app:$SHORT_SHA'
  - 'docker.io/arulrajah/cloud-native-web-app:latest'

options:
  logging: NONE