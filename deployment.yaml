apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-native-web-app

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: cloud-native-web-app

  template:
    metadata:
      labels:
        app: cloud-native-web-app

    spec:
      containers:
        - name: cloud-native-web-app
          image: docker.io/arulrajah/cloud-native-web-app:latest

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"